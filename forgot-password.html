<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PropertyFlow — Forgot Password</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-box">

    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
      </div>
      <span class="auth-logo-text">PropertyFlow</span>
    </div>

    <div class="auth-card" id="card">
      <h1>Reset your password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>

      <div id="alert" class="alert alert-error" style="display:none"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group" style="margin-bottom:0">
          <button type="submit" class="btn btn-primary w-full" id="submit-btn">Send reset link</button>
        </div>
      </form>
    </div>

    <p class="auth-footer"><a href="index.html">Back to sign in</a></p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-ui.js"></script>
<script>
  const form = document.getElementById('forgot-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideAlert();

    const email = document.getElementById('email').value.trim().toLowerCase();
    setBusy(submitBtn, true, 'Sending...');

    try {
      await requestPasswordReset(email);
      showPanel('card', {
        title: 'Check your email',
        message: 'If an account exists for ' + email + ', a password reset link is on its way.',
        linkHref: 'index.html',
        linkText: 'Back to sign in'
      });
    } catch (error) {
      showAlert(error.message);
      setBusy(submitBtn, false);
    }
  });
</script>

</body>
</html>
