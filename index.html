<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PropertyFlow — Sign In</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-box">

    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
      </div>
      <span class="auth-logo-text">PropertyFlow</span>
    </div>

    <div class="auth-card" id="card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to your PropertyFlow account</p>

      <div id="alert" class="alert alert-error" style="display:none"></div>

      <div id="resend-row" style="display:none;margin-bottom:16px;font-size:13px">
        <button type="button" class="link-btn" id="resend-btn">Resend confirmation email</button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group" style="margin-bottom:8px">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

        <div class="form-group" style="margin-top:16px;margin-bottom:0">
          <button type="submit" class="btn btn-primary w-full" id="submit-btn">Sign in</button>
        </div>
      </form>
    </div>

    <p class="auth-footer">Landlord? <a href="register.html">Create an account</a></p>
    <p class="auth-footer" style="margin-top:8px">Tenant? <a href="tenant-signup.html">Set up your tenant account</a></p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/password-toggle.js"></script>
<script>
  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const submitBtn = document.getElementById('submit-btn');
  const resendRow = document.getElementById('resend-row');
  const resendBtn = document.getElementById('resend-btn');

  (async function () {
    if (window.location.hash.includes('error_code=')) {
      showAlert('That email link has expired or was already used. Sign in below. If your email is still unconfirmed, you can request a new link.');
    }

    try {
      const { data } = await sb.auth.getSession();
      if (!data.session) return;

      const profile = await loadCurrentUser();
      if (profile) {
        redirectTo(homeFor(profile.role));
      } else {
        await sb.auth.signOut();
        showAlert('Your email is confirmed, but your landlord has not added you yet. Ask them to add your email address, then sign in.');
      }
    } catch (error) {
      console.error(error);
    }
  })();

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideAlert();
    resendRow.style.display = 'none';

    const email = emailInput.value.trim();
    const password = document.getElementById('password').value;

    setBusy(submitBtn, true, 'Signing in...');

    try {
      const profile = await login(email, password);
      redirectTo(homeFor(profile.role));
    } catch (error) {
      showAlert(error.message);
      if (error.unconfirmed) resendRow.style.display = 'block';
      setBusy(submitBtn, false);
    }
  });

  resendBtn.addEventListener('click', async function () {
    const email = emailInput.value.trim();
    if (!email) {
      showAlert('Enter your email address first.');
      return;
    }
    try {
      await resendConfirmation(email);
      showAlert('Confirmation email sent. Check your inbox.', 'success');
    } catch (error) {
      showAlert(error.message);
    }
  });
</script>

</body>
</html>
