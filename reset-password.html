<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PropertyFlow — Set New Password</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-box">

    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
      </div>
      <span class="auth-logo-text">PropertyFlow</span>
    </div>

    <div class="auth-card" id="card">
      <div id="checking">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>

      <div id="reset-panel" style="display:none">
        <h1>Set a new password</h1>
        <p class="auth-subtitle">Choose a new password for your account</p>

        <div id="alert" class="alert alert-error" style="display:none"></div>

        <form id="reset-form">
          <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <input type="password" id="password" class="form-input" placeholder="At least 8 characters" autocomplete="new-password" required />
          </div>

          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" autocomplete="new-password" required />
          </div>

          <div class="form-group" style="margin-top:20px;margin-bottom:0">
            <button type="submit" class="btn btn-primary w-full" id="submit-btn">Update password</button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/password-toggle.js"></script>
<script>
  const form = document.getElementById('reset-form');
  const submitBtn = document.getElementById('submit-btn');

  (async function () {
    const hasError = window.location.hash.includes('error');
    const { data } = await sb.auth.getSession();

    if (hasError || !data.session) {
      showPanel('card', {
        tone: 'error',
        title: 'Link expired',
        message: 'This password reset link is invalid or has expired. Request a new one to continue.',
        linkHref: 'forgot-password.html',
        linkText: 'Request a new link'
      });
      return;
    }

    document.getElementById('checking').style.display = 'none';
    document.getElementById('reset-panel').style.display = 'block';
  })();

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideAlert();

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm-password').value;

    const problem = validatePassword(password, confirm);
    if (problem) {
      showAlert(problem);
      return;
    }

    setBusy(submitBtn, true, 'Updating...');

    try {
      await updatePassword(password);
      showPanel('card', {
        title: 'Password updated',
        message: 'Your password has been changed.',
        linkHref: 'index.html',
        linkText: 'Continue'
      });
    } catch (error) {
      showAlert(error.message);
      setBusy(submitBtn, false);
    }
  });
</script>

</body>
</html>
